<div class="item-sheet-content">
  <header class="sheet-header">
      <img src="{{img}}" data-action="editImage" data-edit="img" title="{{name}}"/>
      <div class="header-fields">
          <h1 class="charname"><input name="name" type="text" value="{{name}}" placeholder="{{localize 'BITD.Name'}}"/></h1>
      </div>
  </header>

  <section class="flex-vertical">
    <label class="label-stripe">{{localize "BITD.Description"}}</label>
    <prose-mirror name="system.description" value="{{system.description}}" toggled>{{{enriched.description}}}</prose-mirror>
    <label class="label-stripe">{{localize "BITD.Turf"}}</label>
    <div id="turf-container">{{> "systems/blades-in-the-dark/templates/parts/turf-list.html" turfs_data=system.turfs can_edit=true editable=editable}}</div>
  </section>
</div>
